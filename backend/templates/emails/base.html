<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 30px;
            color: #333;
        }
        .footer {
            background: #f1f1f1;
            padding: 20px;
            font-size: 12px;
            text-align: center;
            color: #666;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 15px;
        }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🩺 BookMyDoctor</h1>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        Regards,<br>
        <strong>BookMyDoctor Team</strong><br>
        bookmydoctor.app2026@gmail.com
    </div>
</div>
</body>
</html>
